name: Drive sync

# Ingests new books from the Drive books folder into Neon (`bookrc drive sync`).
# Runs daily from main, so merging is the deploy. Run it by hand from the
# Actions tab (or the GitHub app) to pick up a book right away.
#
# Repo secrets: GEMINI_API_KEY, DATABASE_URL (Neon), GWS_CREDENTIALS_JSON
# (contents of ~/.config/gws/credentials.json). Without them the job skips.

on:
  schedule:
    - cron: '0 10 * * *'  # 10:00 UTC ≈ 3am Pacific
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list new books, ingest nothing'
        type: boolean
        default: false
      max_books:
        description: 'Most books to ingest this run'
        default: '5'

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GWS_CREDENTIALS_JSON: ${{ secrets.GWS_CREDENTIALS_JSON }}
      GOOGLE_DRIVE_FOLDER_ID: 1ip13wKCBGznT2S2HSESUseiNciJBMFCm
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$DATABASE_URL" ] || [ -z "$GWS_CREDENTIALS_JSON" ]; then
            echo "::warning::Drive sync skipped: set GEMINI_API_KEY, DATABASE_URL and GWS_CREDENTIALS_JSON repo secrets"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: astral-sh/setup-uv@v3
        if: steps.secrets.outputs.ready == 'true'

      - name: Sync Drive folder
        if: steps.secrets.outputs.ready == 'true'
        env:
          BOOKRC_GWS_CREDENTIALS: ${{ runner.temp }}/gws-credentials.json
          MAX_BOOKS: ${{ inputs.max_books || '5' }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          umask 077
          printf '%s' "$GWS_CREDENTIALS_JSON" > "$BOOKRC_GWS_CREDENTIALS"
          uv run --python 3.11 bookrc drive sync \
            --max-books "$MAX_BOOKS" $DRY_RUN_FLAG
